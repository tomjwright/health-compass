services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_compass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "4318:4318"   # OTLP over HTTP (spans in)
      - "16686:16686" # web UI
