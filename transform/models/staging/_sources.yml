version: 2

sources:
  - name: clinicaltrials
    description: ClinicalTrials.gov trials, appended by dlt each load (`health_compass.ingest.clinicaltrials`).
    database: raw_data
    schema: clinicaltrials
    tables:
      - name: loads
        description: One row per load, with the version of the data it loaded.
      - name: studies
        description: One row per trial per load, with only the modules the models read.
      - name: studies__protocol_section__design_module__phases
      - name: studies__protocol_section__conditions_module__conditions
      - name: studies__protocol_section__arms_interventions_module__interventions
      - name: studies__protocol_section__contacts_locations_module__locations
      - name: studies__derived_section__condition_browse_module__meshes

  - name: openfda
    description: openFDA's drug applications and labels, loaded by dlt (`health_compass.ingest.openfda`).
    database: raw_data
    schema: openfda
    tables:
      - name: applications
      - name: applications__products
      - name: applications__products__active_ingredients
      - name: applications__submissions
      - name: labels
      - name: labels__indications_and_usage
      - name: labels__openfda__application_number
      - name: labels__openfda__brand_name

  - name: ema
    description: EMA's medicines for people, loaded by dlt (`health_compass.ingest.ema`).
    database: raw_data
    schema: ema
    tables:
      - name: medicines
