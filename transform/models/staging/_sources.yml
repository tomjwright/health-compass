version: 2

sources:
  - name: raw
    description: Raw ClinicalTrials.gov data, loaded unchanged by `health_compass.load`.
    tables:
      - name: clinicaltrials_loads
        description: One row per complete load, from its manifest.json.
      - name: clinicaltrials_studies
        description: One row per trial per load, the trial's JSON exactly as the API returned it.

  - name: openfda
    description: openFDA's drug applications and labels, loaded by dlt (`health_compass.ingest.openfda`).
    database: raw_data
    schema: openfda
    tables:
      - name: applications
      - name: applications__products
      - name: applications__products__active_ingredients
      - name: applications__submissions
      - name: labels
      - name: labels__indications_and_usage
      - name: labels__openfda__application_number
      - name: labels__openfda__brand_name

  - name: ema
    description: EMA's medicines for people, loaded by dlt (`health_compass.ingest.ema`).
    database: raw_data
    schema: ema
    tables:
      - name: medicines
