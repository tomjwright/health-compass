# `python -m health_compass.transform` points this at a new file, then swaps it in when dbt passes.
health_compass:
  target: default
  outputs:
    default:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH') }}"
      threads: 4
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '1GB') }}"
      # The raw openFDA and EMA tables that dlt loads, read-only.
      attach:
        - path: "{{ env_var('RAW_DUCKDB_PATH', 'data/raw.duckdb') }}"
          alias: raw_data
          read_only: true
