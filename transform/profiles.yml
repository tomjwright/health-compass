# `python -m health_compass.transform` points this at a new file, then swaps it in when dbt passes.
health_compass:
  target: default
  outputs:
    default:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH') }}"
      threads: 4
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '1GB') }}"
