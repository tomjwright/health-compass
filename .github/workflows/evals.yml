name: Evals

# The release gate: runs the agent on evals/cases.yaml with the real LLM, and fails when any
# score drops below its threshold. Make "evals" a required check so a failing change can't merge.
# It runs on every PR: a required check that a path filter skips stays pending and blocks merging.
# A PR that only changes text files passes straight away, without calling the LLM.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skip when only text files changed
        id: changes
        if: github.event_name == 'pull_request'
        # --no-renames lists a renamed file's old path too; quotePath=false keeps accented names
        # unquoted, so the suffix check sees them as they are.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git -c core.quotePath=false diff --name-only --no-renames "origin/${BASE_REF}...HEAD")
          if ! echo "$changed" | grep -qvE '\.(md|txt|rst)$'; then
            echo "Only text files changed, so no LLM calls are needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        if: steps.changes.outputs.skip != 'true'
      - run: uv sync --frozen
        if: steps.changes.outputs.skip != 'true'
      - name: Run the evals
        if: steps.changes.outputs.skip != 'true'
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Add GOOGLE_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
          uv run python -m health_compass.evals
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.changes.outputs.skip != 'true'
        with:
          name: eval-results
          path: data/eval_results.json
