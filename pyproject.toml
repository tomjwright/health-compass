[project]
name = "health-compass"
version = "0.1.0"
description = "Evidence-backed health insights: latest trials, approved treatments and nearby recruiting trials."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "dbos>=3.5",
    "dbt-duckdb>=1.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain>=1.4.6,<2",
    "langchain-google-genai>=4.4.2,<5",
    "langgraph>=1.2.16,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_compass"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
